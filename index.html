<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="src/style.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.30.1/moment-with-locales.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment-timezone/0.6.3/moment-timezone-with-data-1970-2030.min.js"></script>
    <title>World Clock App</title>
  </head>
  <body>
    <div class="container">
      <h1>World Clock</h1>
      <div class="clock-number">
        <div class="clock">
          <div class="namber namber12">12</div>
          <div class="namber namber3">3</div>
          <div class="namber namber6">6</div>
          <div class="namber namber9">9</div>
          <div class="hand hour-hand"></div>
          <div class="hand minute-hand"></div>
          <div class="hand second-hand"></div>
          <div class="center-dot"></div>
        </div>
      </div>

      <select name="" id="city">
        <option value="">Select a city</option>
        <option value="current">My current Location</option>
        <option value="Europe/Paris">Paris</option>
        <option value="Europe/London">London</option>
        <option value="America/New_York">New York</option>
        <option value="Asia/Singapore">Singapore</option>
      </select>
      <div id="cities"></div>
      <div class="city" id="los-angeles">
        <div>
          <h2>Los Angeles</h2>
          <div class="date">September 14th 2026</div>
        </div>
        <div class="time">3:55:20 <small>AM</small></div>
      </div>
      <div class="city" id="kyiv">
        <div>
          <h2>Kyiv</h2>
          <div class="date">September 14th 2026</div>
        </div>
        <div class="time">3:55:20 <small>AM</small></div>
      </div>
    </div>
    <footer>
      This project was coded by <strong> Olesia Kononova</strong> and is
      open-sourced on
      <a href="https://github.com/Olesia20/scenario-Generator-" target="_blank"
        >GitHub</a
      >
      and is hosted on
      <a href="https://project-world-clock-app.netlify.app/" target="_blank"
        >Netlify</a
      >
    </footer>
    <script src="src/script.js"></script>
  </body>
</html>
