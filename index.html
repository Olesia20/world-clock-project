<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="src/style.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.30.1/moment-with-locales.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment-timezone/0.6.3/moment-timezone-with-data-1970-2030.min.js"></script>
    <title>Document</title>
  </head>
  <body>
    <div class="container">
      <h1>World Clock</h1>
      <select name="" id="">
        <option value="">Select a city</option>
        <option value="">Paris</option>
        <option value="">London</option>
        <option value="">New York</option>
        <option value="">Singapore</option>
      </select>
      <div class="city">
        <div>
          <h2>Kyiv</h2>
          <div class="date">September 14th 2026</div>
        </div>
        <div class="time">3:55:20 <small>AM</small></div>
      </div>
      <div class="city">
        <div>
          <h2>Los Angeles</h2>
          <div class="date">September 14th 2026</div>
        </div>
        <div class="time">3:55:20 <small>AM</small></div>
      </div>
    </div>
    <footer>
      This project was coded by <strong> Olesia Kononova</strong> and is
      open-sourced on
      <a href="https://github.com/Olesia20/scenario-Generator-" target="_blank"
        >GitHub</a
      >
      and is hosted on
      <a href="https://project-world-clock-app.netlify.app/" target="_blank"
        >Netlify</a
      >
    </footer>
    <script src="src/script.js"></script>
  </body>
</html>
